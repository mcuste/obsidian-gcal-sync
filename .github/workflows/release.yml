name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Obsidian downloads the release whose tag matches manifest.json, so they must agree.
      - name: Verify the tag matches manifest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          if [ "$TAG" != "$manifest_version" ]; then
            echo "Tag $TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - run: pnpm build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # The tag is the version, with no v prefix, so it matches the changelog heading as written.
      - name: Create draft release from the changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## [$TAG]" '
            index($0, heading) == 1 { inside = 1; next }
            /^## \[/ { inside = 0 }
            inside
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" --title "$TAG" --draft --notes-file notes.md \
              main.js manifest.json styles.css
          else
            echo "CHANGELOG.md has no section for $TAG; falling back to generated notes" >&2
            gh release create "$TAG" --title "$TAG" --draft --generate-notes \
              main.js manifest.json styles.css
          fi
